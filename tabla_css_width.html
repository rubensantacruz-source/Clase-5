<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propiedad CSS width en tablas</title>
  <style>
    table {
      border-collapse: collapse;
      width: 600px;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #4a90d9;
      color: white;
    }
    caption {
      font-weight: bold;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <table>
    <caption>Propiedad CSS width - ancho de tabla</caption>
    <tr>
      <th>País</th><th>Capital</th><th>Población</th>
    </tr>
    <tr>
      <td>Perú</td><td>Lima</td><td>33 millones</td>
    </tr>
    <tr>
      <td>Argentina</td><td>Buenos Aires</td><td>46 millones</td>
    </tr>
    <tr>
      <td>Chile</td><td>Santiago</td><td>19 millones</td>
    </tr>
  </table>
</body>
</html>
